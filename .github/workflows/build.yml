
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PlannerAndroid_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract project
        run: |
          unzip PlannerAndroid_Project.zip -d .
          ls -la

      - name: Build APK
        run: gradle -p PlannerAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Planner-APK
          path: PlannerAndroid/app/build/outputs/apk/debug/app-debug.apk
